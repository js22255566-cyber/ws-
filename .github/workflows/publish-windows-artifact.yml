name: Publish existing ZL-WA Windows build

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful ZL-WA Windows workflow run to publish'
        required: true
        type: string
      release_tag:
        description: 'Existing version tag matching the built commit'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate source build and release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > run.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > tag.json
          node <<'JS'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync('run.json'));
          const tag = JSON.parse(fs.readFileSync('tag.json'));
          if (run.name !== 'ZL-WA Windows' || run.conclusion !== 'success' ||
              tag.object.type !== 'commit' || tag.object.sha !== run.head_sha) {
            throw Error('Only a successful Windows build at the exact release tag may be published.');
          }
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: Check version
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) throw Error("Version mismatch")'
      - uses: actions/download-artifact@v4
        with:
          name: ZL-WA-Windows-x64
          path: out
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate packages and create checksums
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const version = require('./package.json').version;
          const expected = ['AutoSetup', 'Portable'].map(type => `ZL-WA-win-${type}-${version}-x64.exe`).sort();
          const files = fs.readdirSync('out').sort();
          if (JSON.stringify(files) !== JSON.stringify(expected)) throw Error('Unexpected package set');
          for (const name of files) {
            const data = fs.readFileSync(`out/${name}`);
            if (data.length < 1000000 || data.toString('ascii', 0, 2) !== 'MZ' ||
                !data.subarray(data.readUInt32LE(0x3c), data.readUInt32LE(0x3c) + 4).equals(Buffer.from('PE\0\0'))) {
              throw Error(`Invalid Windows executable: ${name}`);
            }
          }
          JS
          (cd out && sha256sum *.exe > SHA256SUMS.txt)
          cp docs/ACCOUNT-TOOLS.md out/Windows-testing-guide.md
      - name: Replace release packages
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" out/*.exe out/SHA256SUMS.txt out/Windows-testing-guide.md --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
