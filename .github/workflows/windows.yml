name: ZL-WA Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing test release tag; leave empty to build artifacts only'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          pnpm exec install-electron
      - name: Package service recipes
        working-directory: recipes
        run: |
          pnpm install --frozen-lockfile
          pnpm package
      - name: Check types and tests
        run: |
          pnpm typecheck
          pnpm test --runInBand --coverage=false
      - name: Build Windows x64
        run: pnpm build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: ZL-WA-Windows-x64
          path: out/*.exe
          if-no-files-found: error
      - name: Create checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem out -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content out/SHA256SUMS.txt -Encoding utf8
          Copy-Item docs/ACCOUNT-TOOLS.md out/Windows-testing-guide.md
      - name: Publish requested test release
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-zlwa-test\.[0-9]+$') {
            throw 'Only an existing ZL-WA test release tag may be published by this workflow.'
          }
          $files = Get-ChildItem out -Filter *.exe | Select-Object -ExpandProperty FullName
          gh release upload $env:RELEASE_TAG @files out/SHA256SUMS.txt out/Windows-testing-guide.md --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
