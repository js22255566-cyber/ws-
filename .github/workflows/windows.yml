name: ZL-WA Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag (e.g. v7.2.5); leave empty for artifacts only'
        required: false
        type: string
      new_release:
        description: 'Create this version tag and release from the selected commit (e.g. v7.2.11-beta.1); leave empty otherwise'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate release version
        if: inputs.release_tag != '' || inputs.new_release != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || inputs.new_release }}
        run: |
          if ('${{ inputs.release_tag }}' -ne '' -and '${{ inputs.new_release }}' -ne '') { throw 'Use either release_tag or new_release, not both.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match package.json version.' }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          pnpm exec install-electron
      - name: Package service recipes
        working-directory: recipes
        run: |
          pnpm install --frozen-lockfile
          pnpm package
      - name: Check types
        run: pnpm typecheck
      - name: Build Windows x64
        run: pnpm build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: ZL-WA-Windows-x64
          path: out/*.exe
          if-no-files-found: error
      - name: Create checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem out -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content out/SHA256SUMS.txt -Encoding utf8
          Copy-Item docs/ACCOUNT-TOOLS.md out/Windows-testing-guide.md
      - name: Publish requested release
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Only a valid existing ZL-WA version tag may be published by this workflow.'
          }
          $files = Get-ChildItem out -Filter *.exe | Select-Object -ExpandProperty FullName
          gh release upload $env:RELEASE_TAG @files out/SHA256SUMS.txt out/Windows-testing-guide.md --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          if ($env:RELEASE_TAG.Contains('-')) {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          } else {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - name: Create and publish new release
        if: inputs.new_release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.new_release }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'new_release must be a version tag such as v7.2.11 or v7.2.11-beta.1.'
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists; use release_tag to update it.' }
          $files = Get-ChildItem out -Filter *.exe | Select-Object -ExpandProperty FullName
          $flags = @('--target', $env:GITHUB_SHA, '--title', "ZL-WA $($env:RELEASE_TAG.Substring(1))", '--notes-file', 'docs/RELEASE-NOTES.md')
          if ($env:RELEASE_TAG.Contains('-')) { $flags += '--prerelease' } else { $flags += '--latest' }
          gh release create $env:RELEASE_TAG @files out/SHA256SUMS.txt out/Windows-testing-guide.md --repo $env:GITHUB_REPOSITORY @flags
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
