<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font:
          16px 'Segoe UI',
          sans-serif;
        background: #0b141a;
        color: #e9edef;
      }
      #app {
        height: 100%;
        display: flex;
      }
      #side {
        width: 220px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: #111b21;
        border-right: 1px solid #29363c;
        padding: 8px;
      }
      #pane-side {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .fixture-chat {
        height: 72px;
        padding: 14px 4px;
        border-bottom: 1px solid #29363c;
        cursor: pointer;
      }
      .fixture-title {
        height: 22px;
        display: flex;
        align-items: center;
      }
      .fixture-preview {
        height: 18px;
        font-size: 12px;
        color: #9baab3;
      }
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 18px;
        background: #202c33;
      }
      #messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 25px;
      }
      .message-in,
      .message-out {
        background: #202c33;
        padding: 14px;
        max-width: 90%;
        border-radius: 9px;
        margin: 15px 0;
      }
      footer {
        padding: 18px;
        display: flex;
        gap: 12px;
        background: #202c33;
      }
      [contenteditable] {
        min-height: 44px;
        padding: 12px;
        background: #2a3942;
        border-radius: 8px;
        flex: 1;
        white-space: pre-wrap;
      }
      button {
        background: #00a884;
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 12px;
      }
      small {
        display: block;
        color: #91a2ac;
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="side">
        <strong>本地模拟</strong><small>没有登录真实账号</small>
        <div id="pane-side" role="grid"></div>
      </div>
      <div id="main">
        <header>
          <span title="测试联系人" data-id="test-chat"
            >测试联系人 · 本地测试会话</span
          ><small>仅用于界面与流程验证，不连接 WhatsApp 服务器</small>
        </header>
        <div id="messages">
          <div class="message-in">
            <div class="copyable-text">
              <span class="selectable-text"
                >Hello, this is a local test message.</span
              >
            </div>
          </div>
          <div class="message-out">
            <div class="copyable-text">
              <span class="selectable-text"
                >Sent message for manual translation.</span
              >
            </div>
          </div>
        </div>
        <footer>
          <div
            role="textbox"
            contenteditable="true"
            aria-label="消息输入框"
          ></div>
          <button aria-label="Send"><span data-icon="send">发送</span></button>
        </footer>
      </div>
    </div>
    <script>
      window.fixture = {
        sent: [],
        bulk: [],
        fail: false,
        nativeInputs: 0,
        ownPhone: '8613800000001',
      };
      // Simulate the affected editor: webpage execCommand cannot replace its text.
      document.execCommand = () => false;
      const chats = [
        {
          id: { _serialized: '10001@g.us', server: 'g.us', user: '10001' },
          name: '测试群组 A',
        },
        {
          id: { _serialized: '10002@c.us', server: 'c.us', user: '10002' },
          name: '测试联系人 B',
        },
      ];
      fixture.chats = chats;
      fixture.openChat = id => {
        chats.forEach(c => {
          c.active = c.id._serialized === id;
        });
        const chat = chats.find(c => c.id._serialized === id);
        const title = document.querySelector('header span');
        title.dataset.id = id;
        title.title = chat?.name || id;
        title.textContent = chat?.name || id;
      };
      fixture.renderChats = () => {
        document.querySelector('#pane-side').replaceChildren(
          ...[...chats]
            .sort((a, b) => (b.pin || 0) - (a.pin || 0))
            .map(chat => {
              chat.set ??= (key, value) => {
                chat[key] = value;
                fixture.renderChats();
              };
              const row = document.createElement('div');
              row.className = 'fixture-chat';
              row.setAttribute('role', 'row');
              row.dataset.id = chat.id._serialized;
              const title = document.createElement('div');
              title.className = 'fixture-title';
              title.dataset.testid = 'cell-frame-title';
              const name = document.createElement('span');
              name.title = chat.name;
              name.textContent = chat.name;
              title.append(name);
              const preview = document.createElement('div');
              preview.className = 'fixture-preview';
              preview.textContent = '原生消息预览';
              const menu = document.createElement('button');
              menu.dataset.testid = 'native-chat-menu';
              menu.textContent = '⌄';
              menu.onclick = event => {
                event.stopPropagation();
                document.querySelector('[role=menu]')?.remove();
                const popup = document.createElement('div');
                popup.setAttribute('role', 'menu');
                const item = document.createElement('button');
                item.setAttribute('role', fixture.menuRole || 'menuitem');
                item.dataset.animateDropdownItem = 'true';
                item.textContent = fixture.chineseMenu
                  ? chat.pin
                    ? '取消置顶聊天'
                    : '置顶聊天'
                  : chat.pin
                    ? 'Unpin chat'
                    : 'Pin chat';
                item.onclick = () => {
                  fixture.nativePinActions =
                    (fixture.nativePinActions || 0) + 1;
                };
                popup.append(item);
                document.body.append(popup);
              };
              row.append(title, preview, menu);
              if (chat.pin) {
                const icon = document.createElement('span');
                icon.dataset.icon = 'pinned';
                row.append(icon);
              }
              row.onclick = () => fixture.openChat(chat.id._serialized);
              return row;
            }),
        );
      };
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape')
          document.querySelector('[role=menu]')?.remove();
      });
      fixture.renderChats();
      class MsgKey {
        static async newId() {
          return crypto.randomUUID();
        }
        constructor(x) {
          Object.assign(this, x);
          this._serialized = x.id;
        }
      }
      const modules = {
        WAWebCollections: {
          Chat: {
            getModelsArray: () => chats,
            get: id => chats.find(c => c.id._serialized === id),
          },
        },
        WAWebProfilePicThumbCollection: {
          ProfilePicThumb: {
            get: () =>
              fixture.ownAvatar ? { imgFull: fixture.ownAvatar } : undefined,
          },
        },
        WAWebSocketModel: { Socket: { state: 'CONNECTED' } },
        WAWebConnModel: {
          Conn: {
            pushname: '本地测试账号',
            wid: { server: 'c.us', user: '8613800000001' },
          },
        },
        WAWebUserPrefsMeUser: {
          getMaybeMePnUser: () => ({ server: 'c.us', user: fixture.ownPhone }),
          getMaybeMeLidUser: () => ({
            server: 'lid',
            user: fixture.ownPhone + '9',
          }),
        },
        WAWebChatGetters: {
          getActiveChat: () => {
            if (fixture.missingChatGetter)
              throw new Error('Native getter unavailable');
            return (
              chats.find(
                c =>
                  c.id._serialized ===
                  document.querySelector('header span').dataset.id,
              ) || {
                id: {
                  _serialized: document.querySelector('header span').dataset.id,
                },
              }
            );
          },
        },
        WAWebMsgKey: MsgKey,
        WAWebWidFactory: { asUserWidOrThrow: x => x },
        WAWebGetEphemeralFieldsMsgActionsUtils: {
          getEphemeralFields: () => ({}),
        },
        WAWebSendMsgChatAction: {
          addAndSendMsgToChat: (chat, message) => {
            fixture.bulk.push({ id: chat.id._serialized, text: message.body });
            return [
              Promise.resolve(message),
              fixture.fail
                ? Promise.reject(Error('synthetic server failure'))
                : Promise.resolve('OK'),
            ];
          },
        },
      };
      window.require = name => {
        if (!modules[name]) throw Error('unsupported ' + name);
        return modules[name];
      };
      fixture.mediaSent = [];
      fixture.openMedia = (caption = '', withRole = true, kind = 'image') => {
        document.querySelector('#fixture-media')?.remove();
        const root = document.createElement('div');
        root.id = 'fixture-media';
        if (withRole) root.setAttribute('role', 'dialog');
        root.style.cssText =
          'position:fixed;inset:30px;z-index:100;background:#202c33;padding:30px;display:flex;flex-direction:column;gap:20px';
        const image = document.createElement(
          kind === 'video' ? 'video' : kind === 'file' ? 'div' : 'img',
        );
        if (kind === 'file') {
          image.dataset.testid = 'document-preview';
          image.innerHTML = '<span title="sample-A.pdf">sample-A.pdf</span>';
        } else
          image.setAttribute(
            'src',
            'blob:https://web.whatsapp.com/synthetic-image-A',
          );
        image.style.height = '100px';
        const wrap = document.createElement('div');
        wrap.dataset.testid = 'media-caption-input-container';
        const input = document.createElement('div');
        input.contentEditable = 'true';
        input.setAttribute('role', 'textbox');
        input.setAttribute('aria-label', 'Add a caption');
        input.dataset.lexicalEditor = 'true';
        input.textContent = caption;
        wrap.append(input);
        const button = document.createElement('div');
        button.setAttribute('role', 'button');
        button.setAttribute('aria-label', 'Send');
        button.tabIndex = 0;
        button.innerHTML =
          '<span data-icon="wds-ic-send-filled">发送图文</span>';
        const close = document.createElement('button');
        close.textContent = '取消图片';
        close.onclick = () => root.remove();
        const send = () => {
          fixture.mediaSent.push({
            caption: input.textContent,
            image: image.getAttribute('src'),
            kind,
            file: image.querySelector('[title]')?.getAttribute('title'),
          });
          root.remove();
        };
        button.onclick = send;
        input.onkeydown = event => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            send();
          }
        };
        input.addEventListener('input', event => {
          if (event.isTrusted) fixture.nativeInputs++;
        });
        root.append(image, wrap, button, close);
        document.body.append(root);
        input.focus();
      };
      const editor = document.querySelector('[contenteditable]');
      editor.addEventListener('input', event => {
        if (event.isTrusted) fixture.nativeInputs++;
      });
      fixture.editorText = () => {
        const clone = editor.cloneNode(true);
        clone
          .querySelectorAll('img[alt]')
          .forEach(img => img.replaceWith(document.createTextNode(img.alt)));
        return clone.textContent || '';
      };
      const send = () => {
        const text = fixture.editorText();
        if (text.trim()) {
          fixture.sent.push(text);
          editor.innerText = '';
          editor.dispatchEvent(new Event('input', { bubbles: true }));
        }
      };
      document.querySelector('footer button').addEventListener('click', send);
      editor.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
    </script>
  </body>
</html>
